<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preload"
      href="/webfonts/RobotoMono-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />
    <link
      rel="preload"
      href="/webfonts/LexendDeca-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />

    <script>
      document.addEventListener("keydown", function (e) {
        if (e.key == "Escape") e.preventDefault();
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamType Practice | Exam typing practice</title>
    <!-- fallback theme colors -->
    <style>
      :root {
        --bg-color: #323437;
        --main-color: #e2b714;
        --caret-color: #e2b714;
        --sub-color: #646669;
        --sub-alt-color: #2c2e31;
        --text-color: #d1d0c5;
        --error-color: #ca4754;
        --error-extra-color: #7e2a33;
        --colorful-error-color: #ca4754;
        --colorful-error-extra-color: #7e2a33;
        --nav-focus-opacity: 0;
      }
    </style>
    <!-- last configured theme colors (theme controller), applied before the
    first paint to avoid an initial flash of the default theme (and the body
    background fading from it) -->
    <script>
      try {
        var cachedTheme = localStorage.getItem("firstPaintThemeCss");
        if (cachedTheme) {
          var style = document.createElement("style");
          style.textContent = cachedTheme;
          document.head.appendChild(style);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
    <meta name="name" content="ExamType Practice" />
    <meta
      name="description"
      content="Free, private typing practice for Indian government exams — SSC CGL, SSC CHSL and RRB NTPC. Error-percentage scoring, KDPH, full/half mistake diff and category-wise verdicts. Exam typing practice, with your data staying in your browser."
    />
    <meta
      name="keywords"
      content="ExamType Practice, typing test, typing practice, SSC CGL, SSC CHSL, RRB NTPC, government exam typing, speed typing, wpm, KDPH, key depressions"
    />
    <meta
      name="author"
      content="ExamType Practice contributors (GPL-3.0 fork of Monkeytype)"
    />
    <meta property="og:title" content="ExamType Practice" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Free private typing practice for Indian government exams with error-percentage scoring and category-wise verdicts."
    />
    <meta property="og:image" content="/images/examtype-practice-social.png" />
    <meta name="twitter:title" content="ExamType Practice" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/examtype-practice-social.png" />
    <meta name="darkreader-lock" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
      @layer normalize;
      @layer theme;
      @layer base;
      @layer components;
      @layer properties;
      @layer vendor;
      @layer custom-styles;
      @layer hidden;
      @layer utilities;
    </style>
    <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
    <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
    <link rel="stylesheet" class="test" href="styles/vendor.scss" />
  </head>

  <body class="loading">
    <!-- shown without js or css, so it can't be rendered by solid -->
    <load src="html/warnings.html" />
    <!-- renders the app after the markup above -->
    <script type="module" src="ts/index.tsx"></script>
  </body>
</html>
