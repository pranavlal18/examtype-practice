<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found | ExamType Practice</title>
    <link rel="stylesheet" href="styles/standalone.scss" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta name="name" content="ExamType Practice" />
    <meta name="image" content="/images/examtype-practice-social.png" />
    <meta
      name="description"
      content="Free, private typing practice for Indian government exams — SSC CGL, SSC CHSL and RRB NTPC. Error-percentage scoring, KDPH, full/half mistake diff and category-wise verdicts. Exam typing practice, with your data staying in your browser."
    />
    <meta
      name="keywords"
      content="ExamType Practice, typing test, typing practice, SSC CGL, SSC CHSL, RRB NTPC, government exam typing, speed typing, wpm, KDPH, key depressions"
    />
    <meta
      name="author"
      content="ExamType Practice contributors (GPL-3.0 fork of Monkeytype)"
    />
    <meta property="og:title" content="404 Not Found | ExamType Practice" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Free private typing practice for Indian government exams with error-percentage scoring and category-wise verdicts."
    />
    <meta property="og:image" content="/images/examtype-practice-social.png" />
    <meta name="theme-color" content="#172554" id="metaThemeColor" />
    <meta name="twitter:title" content="404 Not Found | ExamType Practice" />
    <meta name="twitter:image" content="/images/examtype-practice-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script type="module" async>
      import { loadCSS } from "./ts/utils/misc";
      loadCSS("/css/fa.min.css", true);
      document.getElementById("page404").classList.remove("hidden");
      document.getElementById("page404").classList.remove("hidden");
      document.querySelector("header").classList.add("focus");
      document.title = "404 Not Found | ExamType Practice";
    </script>
    <load src="html/warnings.html" />
    <style>
      h1 {
        font-weight: unset;
        font-size: 2rem;
        margin-top: 3rem;
        color: var(--sub-color);
      }
      header #logo .icon svg path {
        fill: var(--sub-color);
      }
      a.button {
        border-radius: var(--roundness);
        text-decoration: none;
        background: var(--sub-alt-color);
        color: var(--text-color);
        &:hover {
          background: var(--text-color);
          color: var(--bg-color);
        }
      }
      .page404 {
        display: grid;
        justify-content: center;
        height: 100%;
        align-content: center;
      }
      .page404 .content {
        display: grid;
        grid-auto-flow: column;
        gap: 4rem;
        grid-template-columns: 300px 300px;
      }
      .page404 .image {
        width: 100%;
        align-self: center;
        background-image: url("/images/examtype-practice-banner.png");
        aspect-ratio: 300/199;
        background-size: contain;
        border-radius: var(--roundness);
      }

      .page404 .title {
        font-size: 5rem;
        line-height: 4rem;
        /* margin: -3rem; */
        color: var(--main-color);
        align-self: center;
      }

      .page404 .side {
        justify-items: center;
        display: grid;
        gap: 1rem;
        text-align: center;
      }
      .page404 .big {
        font-size: 10rem;
        line-height: 10rem;
        color: var(--sub-color);
      }

      .page404 .button {
        padding: 1rem 2rem;
        width: max-content;
      }
    </style>
    <div id="app" class="content-grid focus">
      <header class="focus">
        <a id="logo" href="/" router-link="">
          <div class="icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 64 64"
              style="isolation: isolate"
            >
              <rect width="64" height="64" rx="14" fill="#172554" />
              <path
                d="M36 10 L21 36 H31 L27 54 L47 27 H36 L44 10 Z"
                fill="#fbbf24"
                style="fill: #fbbf24"
              />
              <path
                d="M8 22 H24 M8 32 H20 M8 42 H24"
                stroke="#f97316"
                stroke-width="4"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <h1 class="text">
            <div class="top">Exam typing practice</div>
            ExamType Practice
          </h1>
        </a>
      </header>
      <main style="height: 100%">
        <div class="page page404 hidden" id="page404">
          <div class="content">
            <div class="image"></div>
            <div class="side">
              <div class="title">404</div>
              <div>Ooops! Looks like this page or resource doesn't exist.</div>
              <a href="/" class="button" router-link>
                <i class="fas fa-home"></i>
                Go Home
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
